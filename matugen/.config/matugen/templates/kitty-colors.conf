# Generated by Ashen -- do NOT edit by hand, regenerated when the scheme changes
# Dynamic (wallpaper) counterpart of SettingsThemeTab.applyKittyTheme: the six
# syntax hues (2,3,5,6,10,11,13,14) stay fixed so code stays readable; the
# neutrals + accent follow matugen. ANSI blue (color4) = the accent, so whatever
# the terminal paints as "blue" follows the wallpaper: fastfetch, prompt, cava.
# The accent itself is resolved by scripts/ashen-accent.sh, not written here.
# The selection pair keeps `primary` on purpose: its foreground is surface_dim,
# which only reads against the strong tone, never against the container one.
foreground            {{colors.on_surface.default.hex}}
background            {{colors.surface_dim.default.hex}}
selection_foreground  {{colors.surface_dim.default.hex}}
selection_background  {{colors.primary.default.hex}}
