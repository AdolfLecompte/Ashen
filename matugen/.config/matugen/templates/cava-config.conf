# Cava config generated by Ashen -- do NOT edit by hand, regenerated with the
# wallpaper. This is the STANDALONE cava you run in a terminal; the bar's
# visualiser reads ~/.config/cava/ashen.conf instead, emits raw numbers and
# paints them itself in QML, so it has no colours to template.
#
# Everything below the [color] block is behaviour, not palette, and is carried
# over untouched -- matugen writes whole files, so anything not repeated here
# is anything you lose.

[general]
# Framerate (1-144) - higher = smoother but more CPU intensive
framerate = 60

[input]
# Audio input method: pulse, alsa, fifo, or portaudio
method = pulse
# Audio device (leave as default for auto-detection)
source = auto

[output]
# Output method: ncurses, terminal, raw, or circle
method = ncurses
# Terminal color scheme
style = stereo

[color]
# Eight stops climbing from the darkest end of the accent to the brightest,
# so a tall bar is lighter at the tip than at its foot -- the same "one tone at
# two depths" the shell's own gradient uses, spread over the height instead of
# across a pill. Quoted: cava wants the hex in single quotes.
gradient = 1
gradient_count = 8
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary_container.default.hex}}'
gradient_color_3 = '{{colors.secondary.default.hex}}'
gradient_color_4 = '{{colors.primary.default.hex}}'
gradient_color_5 = '{{colors.primary.default.hex}}'
gradient_color_6 = '{{colors.tertiary.default.hex}}'
gradient_color_7 = '{{colors.on_primary_container.default.hex}}'
gradient_color_8 = '{{colors.on_surface.default.hex}}'

[smoothing]
# Noise reduction (0-100) - higher = smoother but less responsive
# 77 is default, 85 provides good balance for smooth visualization
noise_reduction = 85

# Monstercat smoothing (0 or 1) - adds smoothing between adjacent bars
monstercat = 1

# Wave effect (0 or 1) - creates wave-like motion across bars
waves = 0

# Gravity (0-200) - controls how fast bars fall
# 100 = normal gravity, 150 = faster fall, 50 = slower fall
gravity = 120

[eq]
# Equalizer settings for frequency response
# Lower frequencies tend to be louder, so reduce them slightly
1 = 0.8
2 = 0.9
3 = 1.0
4 = 1.1
5 = 1.2
