# Generated by Ashen -- do NOT edit by hand, rewritten with the wallpaper.
#
# A cava THEME, not a cava config: ~/.config/cava/config names it and never
# changes. This is the file every other rice with a themed cava writes too
# (noctalia's sits right beside it).
#
# Only keys cava documents: `gradient_count` (which the old generated config
# carried) is not one of them, and that invented key is why the whole [color]
# block was thrown away and the bars stayed on cava's built-in green-and-blue.
[color]
foreground = '{{colors.primary.default.hex}}'

# Bottom to top: the accent's dark end climbing to the palette's lightest tone,
# so a tall bar is lighter at the tip than at its foot.
gradient = 1
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.secondary.default.hex}}'
gradient_color_3 = '{{colors.primary.default.hex}}'
gradient_color_4 = '{{colors.tertiary.default.hex}}'
gradient_color_5 = '{{colors.on_surface.default.hex}}'
