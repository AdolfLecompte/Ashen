[ColorScheme]
# Qt palette generated by Ashen -- do NOT edit by hand, regenerated with the
# wallpaper. Read by qt5ct and qt6ct, which is what paints every Qt program that
# is not this shell (qbittorrent, VLC, the KDE tools).
#
# The order is Qt's own and there is no way to name the entries in this file, so
# it has to be read positionally against QPalette:
#   windowText, button, light, midlight, dark, mid, text, brightText,
#   buttonText, base, window, shadow, highlight, highlightedText, link,
#   linkVisited, alternateBase, <unused>, toolTipBase, toolTipText,
#   placeholderText, accent
#
# `disabled` differs from `active` in exactly one way: everything that was text
# drops to the muted tone. Greying a disabled control by fading its BACKGROUND
# is what makes half-transparent Qt dialogs look broken over a wallpaper.
active_colors={{colors.on_surface.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.outline.default.hex}}, {{colors.outline_variant.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.primary.default.hex}}
disabled_colors={{colors.on_surface_variant.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.outline.default.hex}}, {{colors.outline_variant.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.outline.default.hex}}
inactive_colors={{colors.on_surface.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.outline.default.hex}}, {{colors.outline_variant.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.surface_container_lowest.default.hex}}, {{colors.surface.default.hex}}, {{colors.shadow.default.hex}}, {{colors.primary.default.hex}}, {{colors.on_primary.default.hex}}, {{colors.primary.default.hex}}, {{colors.tertiary.default.hex}}, {{colors.surface_container.default.hex}}, {{colors.surface.default.hex}}, {{colors.surface_container_high.default.hex}}, {{colors.on_surface.default.hex}}, {{colors.on_surface_variant.default.hex}}, {{colors.primary.default.hex}}
