[config]
scheme_type = "scheme-tonal-spot"
[config.wallpaper]
command = "true"
set = false
# NO post_hooks anywhere in this file. A hook fires the moment ITS template is
# written, while the others still hold the __ASHEN_ACCENT__ placeholders that
# scripts/ashen-accent.sh substitutes afterwards -- so anything that reloads an
# app has to run after that script, and lives at the bottom of it instead.
[templates.ashen_colors]
input_path = "~/.config/matugen/templates/scheme.json.template"
output_path = "~/.cache/ashen_scheme.json"

# The candidates ashen-accent.sh picks the accent from: the strong tone, the
# container tone, and the surface it has to be readable against. It cannot be
# decided here -- matugen has no contrast ratio -- and it must not be decided
# twice, or the shell and the apps drift a tone apart on a light palette.
[templates.ashen_accent]
input_path = "~/.config/matugen/templates/accent.json"
output_path = "~/.cache/ashen_accent.json"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/ashen-colors.conf"

# btop reads its theme file once at start, so a running instance keeps the old
# palette until it is restarted; there is no reload hook and nothing to send it.
[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ashen.theme"

# Everything Qt that is NOT this shell. Both toolkits read the same file format
# and neither picks it up on its own, so each gets its own copy at the path its
# config points at. Programs already running keep the old palette.
[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/ashen.conf"
[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/ashen.conf"

# The prompt. Sourced by .zshrc after ~/.p10k.zsh so it wins, which is how the
# prompt can follow the wallpaper without this rice shipping a p10k config.
[templates.p10k]
input_path = "~/.config/matugen/templates/p10k-colors.zsh"
output_path = "~/.cache/ashen_p10k.zsh"

# The standalone terminal cava. NOT the bar's visualiser: that one runs off
# ashen.conf, emits raw numbers and is painted in QML, so it takes its colour
# from Colors like everything else in the shell. A running cava reads the file
# once, so it picks the new gradient up on its next start.
# A cava THEME file, which ~/.config/cava/config points at by name. The config
# itself is static and stowed: rewriting it under a running cava is what used to
# break the bars, and cava has this split built in for exactly that reason.
[templates.cava]
input_path = "~/.config/matugen/templates/cava-config.conf"
output_path = "~/.config/cava/themes/ashen"
