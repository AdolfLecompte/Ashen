[config]
scheme_type = "scheme-tonal-spot"
[config.wallpaper]
command = "true"
set = false
[templates.ashen_colors]
input_path = "~/.config/matugen/templates/scheme.json.template"
output_path = "~/.cache/ashen_scheme.json"
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3.css"
output_path = "~/.config/gtk-3.0/gtk.css"
# xdg-desktop-portal-gtk renders the file dialogs Brave/Chromium open for
# downloads. GTK reads gtk.css once at process start and caches it, so that
# long-lived portal keeps the palette from login and its dialogs show the old
# wallpaper's colours. Restart it after the new gtk.css lands; it is D-Bus
# activated, so the next dialog respawns it and reads the fresh file.
post_hook = "systemctl --user restart xdg-desktop-portal-gtk.service"
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/ashen-colors.conf"
# Live-reload every open kitty from the file just written, so fastfetch/prompt
# repaint without a restart. kitty appends -<pid> to the listen socket.
post_hook = "sh -c 'for s in /tmp/kitty-ashen.sock-*; do [ -S \"$s\" ] && kitten @ --to \"unix:$s\" set-colors --all --configured \"$HOME/.config/kitty/ashen-colors.conf\" 2>/dev/null; done; true'"

# Only writes the accent hex to the cache; the border is applied to Hyprland by
# scripts/ashen-apply-border.sh (called from the wallpaper/recolor scripts),
# because a matugen post_hook runs under Quickshell's env — no
# HYPRLAND_INSTANCE_SIGNATURE — where hyprctl fails and aborts the hook.
[templates.hypr_border]
input_path = "~/.config/matugen/templates/border_color.template"
output_path = "~/.cache/matugen_border_color.txt"

# btop reads its theme file once at start, so a running instance keeps the old
# palette until it is restarted; there is no reload hook and nothing to send it.
[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ashen.theme"

# Everything Qt that is NOT this shell. Both toolkits read the same file format
# and neither picks it up on its own, so each gets its own copy at the path its
# config points at. Programs already running keep the old palette.
[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/ashen.conf"
[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/ashen.conf"

# The standalone terminal cava. NOT the bar's visualiser: that one runs off
# ashen.conf, emits raw numbers and is painted in QML, so it takes its colour
# from Colors like everything else in the shell. A running cava reads the file
# once, so it picks the new gradient up on its next start.
[templates.cava]
input_path = "~/.config/matugen/templates/cava-config.conf"
output_path = "~/.config/cava/config"
